# Project Configuration
# Skin Cancer Disease Prediction System

dataset:
  dir: "Dataset/"
  metadata_file: "HAM10000_metadata.csv"
  target_size: [224, 224]
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

model:
  type: "baseline" # or "transfer"
  backbone: "resnet50" # for transfer learning
  num_classes: 7
  input_channels: 3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  checkpoint_dir: "models/"
  random_seed: 42

augmentation:
  rotation: 15 # degrees
  flip_probability: 0.5
  crop_probability: 0.5
  zoom_range: [0.8, 1.2]
  brightness: 0.1
  contrast: 0.1

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "confusion_matrix"]
  report_dir: "reports/"

webapp:
  host: "localhost"
  port: 5000
  debug: false
  max_file_size_mb: 10
  allowed_formats: ["jpg", "jpeg", "png"]

